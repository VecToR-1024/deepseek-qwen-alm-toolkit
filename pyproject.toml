[build-system]
requires = ["setuptools>=78,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-qwen-alm-toolkit"
version = "0.1.0"
description = "Offline DeepSeek-to-Qwen coding distillation with durable collection and byte-level ALM"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "DeepSeek-Qwen ALM research project" }]
keywords = ["distillation", "alm", "qwen", "deepseek", "coding"]

[project.optional-dependencies]
collect = ["openai>=2.45,<3"]
archive = ["zstandard>=0.25,<0.26"]
release = ["huggingface_hub>=1.3,<2"]
data = [
  "datasets>=5,<6",
  "transformers>=4.37,<6",
]
align = ["transformers>=4.37,<6"]
train = [
  "torch>=2.11,<2.12",
  "trl==1.7.1",
  "datasets>=5,<6",
  "peft>=0.19,<0.20",
  "transformers>=4.37,<6",
]
deploy = ["paramiko>=3.5,<5"]
test = [
  "pytest>=9,<10",
  "torch>=2.11,<2.12",
  "trl==1.7.1",
  "datasets>=5,<6",
  "peft>=0.19,<0.20",
  "transformers>=4.37,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
